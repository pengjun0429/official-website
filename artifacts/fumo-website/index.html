    <meta name="theme-color" content="#ffffff" />
    <script>
      try {
        const savedTheme = localStorage.getItem("fumo_theme");
        const darkTheme = savedTheme === "dark" || (savedTheme !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", darkTheme);
        document.documentElement.style.colorScheme = darkTheme ? "dark" : "light";
        document.querySelector('meta[name="theme-color"]')?.setAttribute("content", darkTheme ? "#17191c" : "#ffffff");
      } catch {
        // Use the light palette when browser storage or media queries are unavailable.
      }
    </script>
